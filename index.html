<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - GitHub Pages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <button id="theme-toggle" aria-label="Toggle Theme">🌙 Dark Mode</button>
        </header>
        <main>
            <div class="card">
                <div class="badge">GitHub Pages Ready</div>
                <h1>Hello, World! 👋</h1>
                <p>Welcome to your newly deployed static website hosted on GitHub Pages!</p>
                <div class="interactive-section">
                    <button id="greet-btn" class="btn">Click for a Greeting</button>
                    <p id="greeting-message" class="greeting-text"></p>
                </div>
            </div>
        </main>
        <footer>
            <p>Hosted with ❤️ on <a href="https://pages.github.com/" target="_blank" rel="noopener noreferrer">GitHub Pages</a></p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
